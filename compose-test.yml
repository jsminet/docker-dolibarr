services:
  traefik:
    image: traefik:3.2.3
    ports:
      # Exposes port 80 for incomming web requests
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app/traefik/conf/traefik-test.yml:/etc/traefik/traefik.yml

  mariadb:
    image: mariadb
    hostname: mariadb
    #command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE
      #- LANG=C.UTF-8
    volumes:
      - ./app/mariadb/conf:/etc/mysql/conf.d
      - ./app/mariadb/dump:/docker-entrypoint-initdb.d
      - mariadb-data:/var/lib/mysql

  dolibarr:
    image: dolibarr/dolibarr:20.0.1
    environment:
      - DOLI_DB_HOST
      - DOLI_DB_USER
      - DOLI_DB_PASSWORD
      - DOLI_DB_NAME
      - DOLI_URL_ROOT
      - PHP_INI_DATE_TIMEZONE
      - DOLI_INSTALL_AUTO
    volumes:
      - dolibarr-data:/var/www/documents
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dolibarr.rule=Host(`$DOLIBARR_DNS`)"
      - "traefik.http.routers.dolibarr.entrypoints=web"
      - "traefik.http.routers.dolibarr.service=dolibarr"
      - "traefik.http.services.dolibarr.loadbalancer.server.port=80"

  adminer:
    image: adminer
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`$ADMINER_DNS`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.service=adminer"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

  ubuntu-cron:
    container_name: ubuntu-cron
    build:
      context: ./app/docker-cron
    init: true
    environment:
      - DOLI_DB_HOST
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE
    volumes:
      - ./app/docker-cron/crontab:/etc/crontab
      - ./app/docker-cron/scripts:/scripts
      - dolibarr-data:/var/www/documents
      - dolibarr-dump:/dump
      
volumes:
  mariadb-data:
  dolibarr-data:
  dolibarr-dump: