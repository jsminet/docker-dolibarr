services:
  traefik:
    image: traefik:3.2.1
    ports:
      # Exposes port 80 for incomming web requests
      - 80:80
      - 443:443
    #labels:
      #- "traefik.enable=true"
      #- "traefik.http.routers.traefik.rule=Host(`$TRAEFIK_DNS`)"
      #- "traefik.http.routers.traefik.entrypoints=websecure"
      #- "traefik.http.routers.traefik.service=traefik"
      #- "traefik.http.routers.dolibarr.tls.certresolver=myresolver"
      #- "traefik.http.services.traefik.loadbalancer.server.port=8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app/traefik/conf/traefik.yml:/etc/traefik/traefik.yml
      - acme-data:/letsencrypt/acme.json

  mariadb:
    image: mariadb
    hostname: mariadb
    environment:
      - MYSQL_ROOT_PASSWORD_FILE
      - MYSQL_DATABASE
    secrets:
      - mysql_root_password
    volumes:
      - ./app/mariadb/conf:/etc/mysql/conf.d
      - ./app/mariadb/dump:/docker-entrypoint-initdb.d
      - mariadb-data:/var/lib/mysql

  dolibarr:
    image: dolibarr/dolibarr
    environment:
      - DOLI_DB_HOST
      - DOLI_DB_USER
      - DOLI_DB_PASSWORD_FILE
      - DOLI_DB_NAME
      - DOLI_URL_ROOT
      - PHP_INI_DATE_TIMEZONE
      - DOLI_INSTALL_AUTO
    secrets:
      - mysql_root_password
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dolibarr.rule=Host(`$DOLIBARR_DNS`)"
      - "traefik.http.routers.dolibarr.entrypoints=websecure"
      - "traefik.http.routers.dolibarr.service=dolibarr"
      - "traefik.http.routers.dolibarr.tls=true"
      - "traefik.http.routers.dolibarr.tls.certresolver=myresolver"
      - "traefik.http.services.dolibarr.loadbalancer.server.port=80"
    volumes:
      - dolibarr-data:/var/www/documents

volumes:
  mariadb-data:
  dolibarr-data:
  acme-data:

secrets:
  mysql_root_password:
    external: true